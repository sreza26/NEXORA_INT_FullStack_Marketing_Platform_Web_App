version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: nexora-local-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nexora_local
      MYSQL_USER: nexora
      MYSQL_PASSWORD: nexora_local_pw
    ports:
      - "3306:3306"
    volumes:
      - nexora_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  nexora_mysql_data:
